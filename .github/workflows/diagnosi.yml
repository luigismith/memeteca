name: MEMETECA — diagnosi API

# Confronta cio' che l'API dichiara nostro con cio' che stato.json dice
# pubblicato. Serve quando profilo e stato non concordano. Sola lettura.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r agente/requirements.txt
      - working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: python diagnosi.py
      # 27 agosto 2026: la diagnosi dei Reel gira qui dentro invece che in un
      # workflow suo, cosi' e' lanciabile con un dispatch solo. E' sola
      # lettura: non crea container, quindi non consuma budget video.
      - working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: python diagnosi_reel.py
