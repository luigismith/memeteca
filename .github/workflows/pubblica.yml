name: MEMETECA — pubblicazione automatica

# QUI ESCE IL POST ORDINARIO, e il motivo è semplice: il token vive nei segreti
# di questo repository, quindi GitHub Actions è l'unico posto da cui si può
# pubblicare senza che la chiave giri altrove.
#
# Le sessioni pianificate (12:30, 18:30, 21:00 italiane) NON pubblicano più la
# scheda ordinaria: guardano le notizie, decidono l'eventuale post bonus e
# scrivono le schede nuove. Vedi docs/03_AGENTE_AUTONOMO.md.
#
# Il tetto di due schede al giorno non dipende da questi orari: è una regola
# dentro `pubblica.py` (uscite_di_oggi), che conta le uscite in ora italiana.
# Se una scheda è già uscita a mano, il cron successivo si ferma da solo.
#
# ATTENZIONE agli orari: il cron di GitHub è in UTC e non conosce l'ora legale.
# Da fine ottobre, con l'ora solare, va spostato un'ora avanti (11:30).
# 1 SETTEMBRE 2026: QUESTO CRON NON E' PIU' QUELLO CHE FA USCIRE I POST.
#
# Lo schedule di GitHub ha smesso di essere eseguito su questo repository.
# Venerdi' 28 agosto: zero corse su venti. Lunedi' 31: zero su venti. Sabato
# 29: una corsa di venerdi' consegnata con sei ore di ritardo, che ha fatto
# uscire la 034 alle 2:37 del mattino. Il workflow risulta «active», il file
# e' sul ramo di default, i permessi sono a posto: non c'e' niente da
# riparare, GitHub semplicemente non lo esegue.
#
# Un sospetto, che resta un sospetto: fino al 26 agosto le corse programmate
# partivano regolari da settimane. Il 27 abbiamo lanciato decine di workflow
# a mano per diagnosticare i Reel — una venticinquina di contenitori e altri
# dispatch — e da li' lo schedule non e' piu' partito. GitHub deprioritizza
# le corse programmate dei repository che consumano molto. Non e' dimostrato,
# ma il momento coincide troppo bene per non scriverlo.
#
# Decisione di Luigi, 1 settembre 2026: la pubblicazione la innesca un
# compito pianificato di Claude, che lancia workflow_dispatch su questo
# workflow lunedi', mercoledi' e venerdi' alle 12:35 italiane. Il cron qui
# sotto resta acceso e non fa danni: se un giorno GitHub tornasse a
# eseguirlo, il tetto di una scheda al giorno dentro pubblica.py impedisce il
# doppione, e la fascia oraria impedisce il post notturno.
#
# Quindi: se un giorno la scheda non esce, NON e' questo cron ad aver
# fallito. E' il compito pianificato che non e' partito, e si guarda li'.
on:
  schedule:
    # Si tenta ogni VENTI MINUTI dalle 12:34 alle 21:54 italiane, lun/mer/ven.
    # Non e' uno spreco: `uscite_di_oggi` dentro pubblica.py fa uscire UNA
    # sola scheda al giorno, quindi i tentativi successivi al primo riuscito
    # escono subito senza pubblicare niente.
    #
    # Due cicatrici, non una.
    # 26 agosto 2026: la corsa delle 12:30 fallisce (token invalidato) e la
    # giornata salta del tutto, perche' non c'era nessuno a rilanciarla. Da
    # li' il ritentativo.
    # 28 agosto 2026: la giornata salta lo stesso, e stavolta il cron non e'
    # proprio partito — NESSUNA delle nove corse previste. L'ultima corsa
    # `schedule` risaliva al 26. Il workflow risultava «active», il file era
    # sul ramo di default, non c'era niente da riparare: GitHub semplicemente
    # non ha eseguito lo schedule. Succede, ed e' scritto nella loro
    # documentazione: le corse programmate possono essere ritardate o saltate
    # quando la coda e' carica, tanto piu' negli orari tondi.
    #
    # Quindi: minuti dispari, lontani da :00 e :30 dove si accalcano tutti, e
    # venti tentativi invece di nove. Non e' una garanzia — un cron di GitHub
    # non lo e' mai — ma perdere venti tentativi di fila e' molto meno
    # probabile che perderne nove.
    - cron: "34,54 10-19 * * 1,3,5"
  # IL CORDONE. Un push che tocca `scatto.txt` fa partire la pubblicazione.
  #
  # 2 settembre 2026: il compito pianificato di Claude, che doveva essere il
  # nuovo innesco, e' partito alle 10:35 UTC ed e' durato venticinque secondi.
  # Ha riportato «riuscito» senza pubblicare niente: la sessione appena nata
  # non aveva gli strumenti GitHub per lanciare workflow_dispatch, e senza
  # quelli non poteva fare nulla. Un innesco che dipende da uno strumento che
  # potrebbe non esserci non e' un innesco: e' una speranza.
  #
  # Il push invece funziona sempre, perche' e' l'unica cosa che qualunque
  # sessione con il repository collegato sa fare di sicuro. Si scrive una riga
  # in scatto.txt, si committa, si pusha, e la pubblicazione parte.
  #
  # `paths` limita l'innesco a quel file solo: il commit che il workflow fa da
  # solo su agente/stato.json non lo ritriggera, altrimenti si avviterebbe.
  #
  # `branches: main` e' arrivato dopo, il 3 settembre, e l'ha trovato la prova
  # a vuoto invece di un guaio in produzione: il commit che ha introdotto il
  # cordone ne ha fatte partire DUE, di corse — una su main e una sul ramo di
  # lavoro. Senza il vincolo, ogni push di un ramo qualsiasi che tocchi
  # scatto.txt fa girare la pubblicazione, e per giunta con il codice e la
  # coda di quel ramo. Quella volta non e' uscito niente solo perche' il tetto
  # giornaliero era gia' stato raggiunto: una protezione che ha coperto un
  # buco diverso da quello per cui era stata scritta, il che vale come
  # fortuna, non come progetto.
  push:
    branches:
      - main
    paths:
      - "scatto.txt"
  workflow_dispatch:
    inputs:
      prova:
        description: "Simula senza pubblicare"
        type: boolean
        default: false
      forza:
        description: "Pubblica anche oltre il tetto di 2 al giorno (usare a ragion veduta)"
        type: boolean
        default: false

concurrency:
  group: memeteca-pubblicazione
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt

      - name: Installa le dipendenze
        run: pip install -r agente/requirements.txt

      - name: Controlla la scadenza del token
        working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: |
          python - <<'PY'
          from instagram import Instagram
          g = Instagram().giorni_alla_scadenza()
          if g is None:
              print("Scadenza del token non determinabile.")
          else:
              print(f"Il token scade fra {g} giorni.")
              if g < 10:
                  print(f"::warning::Token in scadenza fra {g} giorni: lancia rinnova.ps1")
          PY

      - name: Pubblica la prossima scheda
        working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_BASE_URL: ${{ secrets.MEMETECA_BASE_URL }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: |
          ARG=""
          [ "${{ inputs.prova }}" = "true" ] && ARG="$ARG --prova"
          [ "${{ inputs.forza }}" = "true" ] && ARG="$ARG --forza"
          echo "python pubblica.py pubblica$ARG"
          python pubblica.py pubblica $ARG

      - name: Salva lo stato
        # always(): se la pubblicazione e' riuscita ma un passaggio successivo
        # e' fallito, lo stato DEVE comunque essere registrato, altrimenti la
        # corsa dopo ripubblica lo stesso post.
        if: ${{ always() && inputs.prova != true }}
        run: |
          if [ -n "$(git status --porcelain agente/stato.json)" ]; then
            git config user.name  "memeteca-bot"
            git config user.email "memeteca-bot@users.noreply.github.com"
            git add agente/stato.json
            git commit -m "stato: pubblicata una scheda"
            git push
          fi
