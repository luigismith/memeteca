name: MEMETECA — pubblicazione automatica

# QUI ESCE IL POST ORDINARIO, e il motivo è semplice: il token vive nei segreti
# di questo repository, quindi GitHub Actions è l'unico posto da cui si può
# pubblicare senza che la chiave giri altrove.
#
# Le sessioni pianificate (12:30, 18:30, 21:00 italiane) NON pubblicano più la
# scheda ordinaria: guardano le notizie, decidono l'eventuale post bonus e
# scrivono le schede nuove. Vedi docs/03_AGENTE_AUTONOMO.md.
#
# Il tetto di due schede al giorno non dipende da questi orari: è una regola
# dentro `pubblica.py` (uscite_di_oggi), che conta le uscite in ora italiana.
# Se una scheda è già uscita a mano, il cron successivo si ferma da solo.
#
# ATTENZIONE agli orari: il cron di GitHub è in UTC e non conosce l'ora legale.
# Da fine ottobre, con l'ora solare, va spostato un'ora avanti (11:30).
on:
  schedule:
    # Si tenta OGNI ORA dalle 12:30 alle 20:30 italiane, lun/mer/ven.
    # Non e' uno spreco: `uscite_di_oggi` dentro pubblica.py fa uscire UNA
    # sola scheda al giorno, quindi i tentativi successivi al primo riuscito
    # escono subito senza pubblicare niente. Serve a questo: il 26 agosto la
    # corsa delle 12:30 e' fallita (token invalidato) e la giornata e' saltata
    # del tutto, perche' non c'era nessuno a rilanciarla. Ora si rilancia da sola.
    - cron: "30 10-18 * * 1,3,5"
  workflow_dispatch:
    inputs:
      prova:
        description: "Simula senza pubblicare"
        type: boolean
        default: false
      forza:
        description: "Pubblica anche oltre il tetto di 2 al giorno (usare a ragion veduta)"
        type: boolean
        default: false

concurrency:
  group: memeteca-pubblicazione
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt

      - name: Installa le dipendenze
        run: pip install -r agente/requirements.txt

      - name: Controlla la scadenza del token
        working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: |
          python - <<'PY'
          from instagram import Instagram
          g = Instagram().giorni_alla_scadenza()
          if g is None:
              print("Scadenza del token non determinabile.")
          else:
              print(f"Il token scade fra {g} giorni.")
              if g < 10:
                  print(f"::warning::Token in scadenza fra {g} giorni: lancia rinnova.ps1")
          PY

      - name: Pubblica la prossima scheda
        working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_BASE_URL: ${{ secrets.MEMETECA_BASE_URL }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: |
          ARG=""
          [ "${{ inputs.prova }}" = "true" ] && ARG="$ARG --prova"
          [ "${{ inputs.forza }}" = "true" ] && ARG="$ARG --forza"
          echo "python pubblica.py pubblica$ARG"
          python pubblica.py pubblica $ARG

      - name: Salva lo stato
        # always(): se la pubblicazione e' riuscita ma un passaggio successivo
        # e' fallito, lo stato DEVE comunque essere registrato, altrimenti la
        # corsa dopo ripubblica lo stesso post.
        if: ${{ always() && inputs.prova != true }}
        run: |
          if [ -n "$(git status --porcelain agente/stato.json)" ]; then
            git config user.name  "memeteca-bot"
            git config user.email "memeteca-bot@users.noreply.github.com"
            git add agente/stato.json
            git commit -m "stato: pubblicata una scheda"
            git push
          fi
