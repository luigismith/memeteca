name: MEMETECA — menzioni sui post pubblicati

# Le caption non si modificano via API: per attribuire un meme al suo autore
# su un post gia' uscito si usa un commento con la menzione, che lo notifica.
# Idempotente: si puo' rilanciare senza produrre doppioni.
on:
  workflow_dispatch:
    inputs:
      num:
        description: "Numero scheda, oppure 'tutte'"
        required: true
        type: string

permissions:
  contents: read

jobs:
  menziona:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r agente/requirements.txt
      - working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: |
          if [ "${{ inputs.num }}" = "tutte" ]; then
            python menziona.py --tutte
          else
            python menziona.py "${{ inputs.num }}"
          fi
