name: MEMETECA — rinnovo automatico del token

# IL 26 AGOSTO 2026 IL TOKEN E' MORTO E LA PAGINA SI E' FERMATA UN GIORNO INTERO.
# Il messaggio era: «The session has been invalidated because the user changed
# their password or Facebook has changed the session for security reasons».
#
# Il token Instagram dura 60 giorni e si prolunga all'infinito, ma SOLO finche'
# e' ancora valido: una volta scaduto o invalidato serve una nuova
# autorizzazione a mano. Quindi lo si prolunga molto prima della scadenza,
# da solo, ogni due settimane. Cosi' il caso «serve Luigi» non si presenta.
#
# SERVE UN SEGRETO IN PIU', UNA VOLTA SOLA: GH_PAT, un token GitHub
# fine-grained su questo repository con permesso «Secrets: Read and write».
# Senza quello il workflow prolunga il token ma non puo' salvarlo, e lo dice.

on:
  schedule:
    - cron: "0 4 */14 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rinnova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r agente/requirements.txt

      - name: Prolunga il token e riscrivi il segreto
        working-directory: agente
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          NUOVO=$(python instagram.py rinnova)
          if [ -z "$NUOVO" ]; then
            echo "::error::Rinnovo fallito: il token attuale non e' piu' valido. Serve una nuova autorizzazione a mano."
            exit 1
          fi
          echo "::add-mask::$NUOVO"
          if [ -z "$GH_PAT" ]; then
            echo "::warning::Token prolungato ma NON salvato: manca il segreto GH_PAT."
            exit 0
          fi
          echo "$NUOVO" | GH_TOKEN="$GH_PAT" gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Token prolungato e salvato nei segreti."
