name: MEMETECA — pubblicazione reel

# Pubblica il Reel di una scheda via API. Il video sta in assets/reel_<num>.mp4
# e ha gia' dentro la musica originale (musica.py): esce completo, mai muto.
on:
  # Il cordone dei reel. Stesso motivo del cordone delle schede (scatto.txt,
  # vedi pubblica.yml): un compito pianificato che deve lanciare un
  # workflow_dispatch dipende dagli strumenti GitHub, e il 3 settembre una
  # sessione appena nata non li aveva e ha riportato «riuscito» senza
  # pubblicare niente. Il push invece lo sa fare chiunque abbia il
  # repository collegato.
  #
  # I reel pero' hanno un argomento — quale scheda — e un push non porta
  # argomenti. Quindi il numero sta scritto dentro il file: si cambia la
  # riga, si committa, e parte quel reel li'.
  push:
    branches:
      - main
    paths:
      - "scatto_reel.txt"
  workflow_dispatch:
    inputs:
      num:
        description: "Numero della scheda (es. 021)"
        required: true
        type: string
      prova:
        description: "Valida il video senza pubblicare"
        type: boolean
        default: false
      url:
        description: "URL video alternativo (solo per prove)"
        type: string
        default: ""

concurrency:
  group: memeteca-pubblicazione
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r agente/requirements.txt
      - name: Quale reel
        # Da dispatch il numero arriva negli inputs; dal cordone si legge la
        # prima riga utile di scatto_reel.txt (i commenti iniziano con #).
        run: |
          NUM="${{ inputs.num }}"
          if [ -z "$NUM" ]; then
            NUM=$(grep -m1 -E '^[0-9]{3}$' scatto_reel.txt || true)
          fi
          if [ -z "$NUM" ]; then
            echo "nessun numero: ne' inputs.num ne' una riga valida in scatto_reel.txt"
            exit 1
          fi
          echo "NUM=$NUM" >> "$GITHUB_ENV"
          echo "reel da pubblicare: $NUM"
      - name: Pubblica il reel
        working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_BASE_URL: ${{ secrets.MEMETECA_BASE_URL }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: |
          ARG=""
          [ "${{ inputs.prova }}" = "true" ] && ARG=" --prova"
          [ -n "${{ inputs.url }}" ] && ARG="$ARG --url ${{ inputs.url }}"
          python pubblica_reel.py "$NUM"$ARG
      - name: Salva lo stato
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain agente/stato.json)" ]; then
            git config user.name  "memeteca-bot"
            git config user.email "memeteca-bot@users.noreply.github.com"
            git add agente/stato.json
            git commit -m "stato: pubblicato un reel"
            git push
          fi
