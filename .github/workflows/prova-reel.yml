name: MEMETECA — sonda contenitori video

# Non pubblica niente: crea contenitori e ne stampa lo stato grezzo.
# Serve a capire perche' i Reel via API finiscono in ERROR senza spiegazione.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL pubblico del video da sondare"
        required: false
        default: "https://luigismith.github.io/memeteca/assets/reel_021_v5.mp4"

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r agente/requirements.txt
      - working-directory: agente
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEMETECA_API: ${{ vars.MEMETECA_API }}
        run: python prova_reel.py "${{ inputs.url }}"
